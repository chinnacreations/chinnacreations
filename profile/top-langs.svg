<svg
  xmlns="http://www.w3.org/2000/svg"
  width="495"
  height="195"
  viewBox="0 0 495 195"
  role="img"
  aria-label="Most Used Languages"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1e05a"/>
      <stop offset="45%" stop-color="#3178c6"/>
      <stop offset="75%" stop-color="#e34c26"/>
      <stop offset="100%" stop-color="#563d7c"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="4"
        flood-opacity="0.25"
      />
    </filter>
  </defs>

  <!-- Card -->
  <rect
    x="1"
    y="1"
    width="493"
    height="193"
    rx="12"
    fill="url(#background)"
    stroke="#30363d"
    filter="url(#shadow)"
  />

  <!-- Title -->
  <text
    x="25"
    y="38"
    fill="#58a6ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
  >
    Most Used Languages
  </text>

  <!-- Language progress bar background -->
  <rect
    x="25"
    y="62"
    width="445"
    height="13"
    rx="6.5"
    fill="#30363d"
  />

  <!-- JavaScript -->
  <rect
    x="25"
    y="62"
    width="190"
    height="13"
    rx="6.5"
    fill="#f1e05a"
  />

  <!-- TypeScript -->
  <rect
    x="215"
    y="62"
    width="125"
    height="13"
    fill="#3178c6"
  />

  <!-- HTML -->
  <rect
    x="340"
    y="62"
    width="75"
    height="13"
    fill="#e34c26"
  />

  <!-- CSS -->
  <rect
    x="415"
    y="62"
    width="55"
    height="13"
    rx="0 6.5 6.5 0"
    fill="#563d7c"
  />

  <!-- Language names -->

  <circle
    cx="30"
    cy="102"
    r="5"
    fill="#f1e05a"
  />

  <text
    x="42"
    y="107"
    fill="#f0f6fc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
  >
    JavaScript
  </text>

  <circle
    cx="155"
    cy="102"
    r="5"
    fill="#3178c6"
  />

  <text
    x="167"
    y="107"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
  >
    TypeScript
  </text>

  <circle
    cx="285"
    cy="102"
    r="5"
    fill="#e34c26"
  />

  <text
    x="297"
    y="107"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
  >
    HTML
  </text>

  <circle
    cx="370"
    cy="102"
    r="5"
    fill="#563d7c"
  />

  <text
    x="382"
    y="107"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
  >
    CSS
  </text>

  <!-- Profile -->
  <text
    x="25"
    y="143"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
  >
    GitHub Profile
  </text>

  <text
    x="25"
    y="165"
    fill="#f0f6fc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
  >
    chinnacreations
  </text>

  <!-- Footer -->
  <text
    x="25"
    y="184"
    fill="#58a6ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
  >
    GitHub Profile • Top Languages
  </text>

</svg>
