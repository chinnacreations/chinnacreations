<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub Stats">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="10" fill="url(#bg)" stroke="#30363d"/>
  <text x="25" y="38" fill="#58a6ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">GitHub Stats</text>
  <text x="25" y="75" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">Commits</text>
  <text x="25" y="98" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="17" font-weight="700">Generated by GitHub Actions</text>
  <text x="25" y="132" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">Profile</text>
  <text x="25" y="155" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="16">chinnacreations</text>
  <text x="25" y="180" fill="#58a6ff" font-family="Arial, sans-serif" font-size="12">This file is updated automatically.</text>
</svg>
