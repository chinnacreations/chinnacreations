<svg width="1200" height="330" viewBox="0 0 1200 330"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient
id="bg"
x1="0"
y1="0"
x2="1200"
y2="330"
gradientUnits="userSpaceOnUse">

<stop stop-color="#06101F"/>
<stop offset="0.55" stop-color="#071A3D"/>
<stop offset="1" stop-color="#180B42"/>

</linearGradient>

<linearGradient
id="title"
x1="80"
y1="100"
x2="600"
y2="100"
gradientUnits="userSpaceOnUse">

<stop stop-color="#22D3EE"/>
<stop offset="0.5" stop-color="#A78BFA"/>
<stop offset="1" stop-color="#F472B6"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="12"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>


<!-- Background -->

<rect
x="5"
y="5"
width="1190"
height="320"
rx="22"
fill="url(#bg)"
stroke="#1E3A5F"/>


<!-- Glow -->

<circle
cx="1040"
cy="70"
r="95"
fill="#4F46E5"
opacity="0.15"
filter="url(#glow)"/>

<circle
cx="1120"
cy="250"
r="110"
fill="#A855F7"
opacity="0.13"
filter="url(#glow)"/>


<!-- Stars -->

<circle cx="720" cy="55" r="3" fill="#22D3EE"/>
