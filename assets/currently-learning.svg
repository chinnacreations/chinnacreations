  <defs>

    <!-- Main background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061426"/>
      <stop offset="52%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#1b123b"/>
    </linearGradient>

    <!-- Heading gradient -->
    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="dsaCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="llmCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>

    <linearGradient id="ragCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>

    <linearGradient id="agentCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <linearGradient id="harnessCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <linearGradient id="systemCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <linearGradient id="securityCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>

    <linearGradient id="hackingCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity=".35"
      />
    </filter>

    <style>
      .heading {
        font: 700 29px Arial, Helvetica, sans-serif;
        fill: url(#heading);
      }

      .quote {
        font: italic 12px Arial, Helvetica, sans-serif;
        fill: #94a3b8;
      }

      .title {
        font: 700 16px Arial, Helvetica, sans-serif;
      }

      .sub {
        font: 400 11px Arial, Helvetica, sans-serif;
        fill: #cbd5e1;
      }

      .desc {
        font: 400 11px Arial, Helvetica, sans-serif;
        fill: #e2e8f0;
      }
    </style>

